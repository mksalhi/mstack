name: skills
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every skill file is reachable from its SKILL.md, no broken links, no lint failures
        run: python3 bench/static.py --check
