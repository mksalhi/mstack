<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion film</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a09; overflow: hidden; }
  canvas { display: block; margin: auto; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<script src="motion.js"></script>
<script>
// Starter film: replace SCENES. The contract is window.seek(t): paint the exact frame for second t,
// with no timers, no state carried between frames, and no Math.random.
const params = new URLSearchParams(location.search);
const FORMATS = { "9x16": [1080, 1920], "1x1": [1080, 1080], "16x9": [1920, 1080] };
const [W, H] = FORMATS[params.get("format")] ?? FORMATS["9x16"];
window.FILM = { width: W, height: H, duration: 6 };

// Lay scenes out in these units, never fixed pixels, so every format reframes from one timeline.
const U = Math.min(W, H) / 1080;
const CX = W / 2, CY = H / 2;
const BG = "#14110f", INK = "#f4efe8", ACCENT = "#e2553d";

const canvas = document.getElementById("film");
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext("2d");

const SCENES = [
  { from: 0, to: 2, draw(t) { // kinetic word: letters rise on a stagger, then an accent bar draws
    const word = "MOTION", size = 200 * U;
    ctx.font = `800 ${size}px system-ui, sans-serif`;
    ctx.textBaseline = "middle";
    ctx.fillStyle = INK;
    const total = ctx.measureText(word).width;
    let x = CX - total / 2;
    for (const [i, letter] of [...word].entries()) {
      const s = spring(t - 0.08 - i * 0.05, ...SPRING.heavy);
      ctx.globalAlpha = clamp(s * 3);
      ctx.fillText(letter, x, CY + (1 - s) * 120 * U);
      x += ctx.measureText(letter).width;
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = ACCENT;
    ctx.fillRect(CX - total / 2, CY + size * 0.62, total * spring(t - 0.55, ...SPRING.snappy), 16 * U);
  } },
  { from: 2, to: 4, draw(t) { // dot grid pops in on a diagonal stagger with seeded jitter
    const rand = rng(7), cols = 6, rows = 6, gap = 150 * U;
    for (let i = 0; i < cols * rows; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const s = spring(t - 0.1 - (col + row) * 0.04 - rand() * 0.08, ...SPRING.playful);
      ctx.fillStyle = i === 15 ? ACCENT : INK;
      ctx.beginPath();
      ctx.arc(CX + (col - (cols - 1) / 2) * gap, CY + (row - (rows - 1) / 2) * gap, Math.max(0, 46 * U * s), 0, Math.PI * 2);
      ctx.fill();
    }
  } },
  { from: 4, to: 6, draw(t) { // one container, never cut: button, then card, then badge
    const w = Math.max(0, track(t, [[0, 0], [0.1, 420], [0.8, 820], [1.5, 240]], ...SPRING.standard)) * U;
    const h = Math.max(0, track(t, [[0, 0], [0.1, 130], [0.8, 460], [1.5, 240]], ...SPRING.standard)) * U;
    const roundness = clamp(track(t, [[0, 1], [0.8, 0.2], [1.5, 1]], ...SPRING.standard));
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.roundRect(CX - w / 2, CY - h / 2, w, h, (Math.min(w, h) / 2) * roundness);
    ctx.fill();
    ctx.fillStyle = BG;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `600 ${54 * U}px system-ui, sans-serif`;
    for (const [label, tIn, tOut] of [["Start", 0.1, 0.8], ["One shape, three states", 0.8, 1.5]]) {
      ctx.globalAlpha = swapAlpha(t, tIn, tOut);
      ctx.fillText(label, CX, CY);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = ACCENT;
    ctx.beginPath();
    ctx.arc(CX, CY, Math.max(0, 60 * U * spring(t - 1.6, ...SPRING.playful)), 0, Math.PI * 2);
    ctx.fill();
  } },
];

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  for (const scene of SCENES) {
    if (t < scene.from || t >= scene.to) continue;
    ctx.save();
    scene.draw(t - scene.from);
    ctx.restore();
  }
}
window.seek = (t) => draw(clamp(t, 0, FILM.duration - 1e-6));

// Live preview when opened in a normal browser. render.mjs adds ?render=1 and drives seek() itself.
if (!params.has("render")) {
  const start = performance.now();
  (function loop() {
    draw(((performance.now() - start) / 1000) % FILM.duration);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
